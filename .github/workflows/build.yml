name: Build iOS App

on:
  push:
    branches: [ main, master, dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
    - uses: actions/checkout@v4

    - name: Build iOS App
      run: |
        xcodebuild -project ShopIOSApp.xcodeproj \
                   -scheme ShopIOSApp \
                   -sdk iphoneos \
                   -configuration Release \
                   -derivedDataPath build \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGN_IDENTITY="" \
                   build

    - name: Compress App
      run: |
        cd build/Build/Products/Release-iphoneos
        zip -r ShopIOSApp.zip *.app

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ShopIOSApp-Zip
        path: build/Build/Products/Release-iphoneos/ShopIOSApp.zip
